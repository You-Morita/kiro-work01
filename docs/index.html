<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiro-work01</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      min-height: 100vh;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 { color: #2d3748; margin-bottom: 8px; }
    header p { color: #718096; }
    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 900px;
    }
    .work-card {
      background: white;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      display: block;
    }
    .work-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .work-card h2 { color: #2d3748; margin-bottom: 8px; font-size: 1.2rem; }
    .work-card p  { color: #718096; font-size: 0.9rem; line-height: 1.5; }
    .tag {
      display: inline-block;
      margin-top: 12px;
      padding: 3px 10px;
      background: #edf2f7;
      border-radius: 9999px;
      font-size: 0.75rem;
      color: #4a5568;
    }
  </style>
</head>
<body>
  <header>
    <h1>kiro-work01 🚀</h1>
    <p>Kiroで作った成果物一覧</p>
  </header>
  <main class="works-grid">
    <a href="works/world-clock/index.html" class="work-card">
      <h2>🌍 World Clock</h2>
      <p>世界10都市の現在時刻をリアルタイムで表示するデジタル時計サイト。</p>
      <span class="tag">HTML / CSS / JS</span>
    </a>
  </main>
</body>
</html>
