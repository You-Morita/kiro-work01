<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiro-work01</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px 60px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #2d3748;
      margin-bottom: 8px;
    }
    p {
      color: #718096;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>kiro-work01</h1>
    <p>Hello from Kiro! 🚀</p>
  </div>
</body>
</html>
